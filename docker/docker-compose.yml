version: '3.9'

services:
  # Frontend (Next.js)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SOCKET_URL=ws://localhost:3001
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - hamster-network
    restart: unless-stopped

  # Backend (Express + Socket.IO)
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://hamster:password@postgres:5432/hamster_db
      - REDIS_URL=redis://redis:6379
      - TURN_SERVER_URL=${TURN_SERVER_URL:-}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      - postgres
      - redis
    networks:
      - hamster-network
    restart: unless-stopped
    volumes:
      - ../apps/backend/src:/app/src
      - ../apps/backend/package.json:/app/package.json

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=hamster
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hamster_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../apps/backend/src/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - hamster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamster"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hamster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

networks:
  hamster-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
